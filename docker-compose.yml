# Für Coolify (Build Pack "Docker Compose") oder lokal: docker compose up -d --build
services:
  smart-mailbox:
    build: .
    restart: unless-stopped
    environment:
      MQTT_URL: ${MQTT_URL:-mqtt://172.16.2.10:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      TOPIC_SLOT: ${TOPIC_SLOT:-zigbee2mqtt/briefkasten_schlitz}
      TOPIC_PARCEL: ${TOPIC_PARCEL:-zigbee2mqtt/briefkasten_paketfach}
      TOPIC_LETTER: ${TOPIC_LETTER:-zigbee2mqtt/briefkasten_brieffach}
      WINDOWS: ${WINDOWS:-05:00-07:00,11:30-14:30}
      TZ: Europe/Zurich
    volumes:
      - smart-mailbox-data:/data
    ports:
      - "${HOST_PORT:-3180}:3000"
volumes:
  smart-mailbox-data:
