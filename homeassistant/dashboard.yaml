# Diagnose-Dashboard «Briefkasten».
# Einrichten: Einstellungen → Dashboards → Dashboard hinzufügen (leer) → öffnen → Bearbeiten →
# ⋮ → Raw-Konfigurationseditor → diesen Inhalt einfügen.
# Die Entitäten legt der Dienst per MQTT-Discovery selbst an (Gerät «Briefkasten»).
title: Briefkasten
views:
  - title: Diagnose
    icon: mdi:mailbox
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Status (was die Logik glaubt)
          - type: tile
            entity: sensor.briefkasten_brieffach
            name: Brieffach
          - type: tile
            entity: sensor.briefkasten_paketfach
            name: Paketfach
          - type: entities
            entities:
              - entity: sensor.briefkasten_einwuerfe
              - entity: sensor.briefkasten_pakete
              - entity: binary_sensor.briefkasten_brieffach_unsicher
              - entity: binary_sensor.briefkasten_paketfach_unsicher
              - entity: binary_sensor.briefkasten_schlitz_blockiert
              - entity: binary_sensor.briefkasten_paketfach_offen
              - entity: binary_sensor.briefkasten_sitzung_aktiv
              - entity: binary_sensor.briefkasten_zustellfenster

      - type: grid
        cards:
          - type: heading
            heading: Letzte Sitzung (Ereignis → Erkennung → Status)
          - type: markdown
            content: >-
              {% set s = 'sensor.briefkasten_letzte_sitzung' %}
              {% if states(s) in ['unknown', 'unavailable'] %}Noch keine Sitzung aufgezeichnet.{% else %}

              **{{ states(s) }}** ({{ state_attr(s, 'konfidenz') }}) · {{ state_attr(s, 'zeit') }}


              **Ablauf:** {{ state_attr(s, 'ablauf') }}


              **Begründung:** {{ state_attr(s, 'begruendung') }}


              **Post/Paket:** {{ state_attr(s, 'vorher').brief }}/{{ state_attr(s, 'vorher').paket }}
              → {{ state_attr(s, 'nachher').brief }}/{{ state_attr(s, 'nachher').paket }}
              · Zustellfenster: {{ 'ja' if state_attr(s, 'zustellfenster') else 'nein' }}
              · Rückmeldung: {{ state_attr(s, 'feedback') }}
              {% endif %}
          - type: heading
            heading: Bewertung
            heading_style: subtitle
          - type: markdown
            content: >-
              **{{ states('sensor.briefkasten_feedback_offen') }}** Sitzungen unbewertet
              · {{ states('sensor.briefkasten_feedback_stimmt') }} stimmen
              · {{ states('sensor.briefkasten_feedback_falsch') }} falsch


              [Sitzungen bewerten (Diagnose-Seite)](http://172.16.2.10:3180/)
          - type: heading
            heading: Sensor-Batterien
            heading_style: subtitle
          - type: entities
            entities:
              - entity: binary_sensor.briefkasten_batterie_schwach
              - entity: sensor.briefkasten_spannung_schlitz
              - entity: sensor.briefkasten_spannung_paketfach
              - entity: sensor.briefkasten_spannung_tuerchen

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Verlauf
          - type: markdown
            grid_options:
              columns: full
            content: >-
              | Zeit | Ablauf | Erkannt | Post/Paket | Rückmeldung |

              |---|---|---|---|---|

              {% for x in state_attr('sensor.briefkasten_verlauf', 'sitzungen') or [] -%}

              | {{ x.zeit }} | {{ x.ablauf }} | **{{ x.code }}** ({{ x.konfidenz }}) | {{ x.vorher }} → {{ x.nachher }} | {{ x.feedback }} |

              {% endfor %}

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: MQTT-Empfang (auch ignorierte Meldungen)
          - type: markdown
            grid_options:
              columns: full
            content: >-
              {% set e = 'sensor.briefkasten_mqtt_empfang' %}
              Meldungen seit Start des Dienstes: **{{ states(e) }}**


              | Sensor | Topic | Meldungen | Ereignisse | Ignoriert | Zustand | Zuletzt | Letztes Ergebnis |

              |---|---|---|---|---|---|---|---|

              {% for x in state_attr(e, 'sensoren') or [] -%}

              | {{ x.name }} | `{{ x.topic }}` | {{ x.meldungen }} | {{ x.ereignisse }} | {{ x.ignoriert }} | {{ x.zustand }} | {{ x.zuletzt or '–' }} | {{ x.ergebnis }} |

              {% endfor %}


              | Zeit | Sensor | Ergebnis | Payload |

              |---|---|---|---|

              {% for m in state_attr(e, 'letzte') or [] -%}

              | {{ m.zeit }} | {{ m.sensor }} | {{ m.ergebnis }} | `{{ m.payload }}` |

              {% endfor %}

      # Rohdaten der Aqara-Sensoren: Entitäts-IDs anpassen, sobald die Sensoren in Home Assistant sichtbar sind.
